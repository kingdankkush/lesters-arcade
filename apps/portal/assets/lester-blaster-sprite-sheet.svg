    <g transform="translate(730 22)"><use href="#lester"/><rect x="52" y="82" width="14" height="14" fill="#ff7b2f"/><path d="M60 82 q20 -24 48 -10" fill="none" stroke="#ffe84d" stroke-width="3" stroke-dasharray="4 4"/></g>
    <g transform="translate(850 42) rotate(18 45 105)"><use href="#lester"/><rect x="78" y="83" width="7" height="7" fill="#ff1f4f"/><rect x="88" y="95" width="6" height="6" fill="#ff476f"/></g>
