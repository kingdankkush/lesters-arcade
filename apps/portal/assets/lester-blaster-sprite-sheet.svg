<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 240" role="img" aria-labelledby="title desc">
  <title id="title">Hard Money Heroes Lester sprite sheet concept</title>
  <desc id="desc">Pixel-art sprite sheet mockup showing idle, run, jump, shoot, knife, grenade, hurt, and death frames.</desc>
  <rect width="960" height="240" fill="#070817"/>
  <g font-family="monospace" font-size="14" fill="#19f7ff">
    <text x="24" y="28">IDLE</text><text x="144" y="28">RUN 1</text><text x="264" y="28">RUN 2</text><text x="384" y="28">JUMP</text>
    <text x="504" y="28">SHOOT</text><text x="624" y="28">KNIFE</text><text x="744" y="28">GRENADE</text><text x="864" y="28">KO</text>
  </g>
  <g shape-rendering="crispEdges">
    <defs>
      <g id="lester"><rect x="16" y="80" width="32" height="42" fill="#ff7b2f"/><rect x="22" y="64" width="22" height="18" fill="#ffe84d"/><rect x="35" y="70" width="6" height="5" fill="#090b17"/><rect x="20" y="99" width="22" height="7" fill="#19f7ff"/><rect x="19" y="122" width="10" height="24" fill="#4f5dff"/><rect x="36" y="122" width="10" height="24" fill="#4f5dff"/></g>
    </defs>
    <g transform="translate(10 22)"><use href="#lester"/><rect x="51" y="100" width="24" height="7" fill="#45ff8a"/></g>
    <g transform="translate(130 22)"><use href="#lester"/><rect x="16" y="146" width="16" height="6" fill="#f9f7ff"/><rect x="40" y="142" width="18" height="6" fill="#f9f7ff"/></g>
    <g transform="translate(250 22)"><use href="#lester"/><rect x="16" y="141" width="18" height="6" fill="#f9f7ff"/><rect x="40" y="148" width="18" height="6" fill="#f9f7ff"/></g>
    <g transform="translate(370 4)"><use href="#lester"/><rect x="16" y="146" width="16" height="6" fill="#f9f7ff"/><rect x="40" y="146" width="16" height="6" fill="#f9f7ff"/><path d="M48 150 l18 10 l-12 8" fill="none" stroke="#19f7ff" stroke-width="4"/></g>
    <g transform="translate(490 22)"><use href="#lester"/><rect x="51" y="100" width="46" height="8" fill="#45ff8a"/><rect x="97" y="98" width="12" height="12" fill="#ffe84d"/><rect x="108" y="101" width="20" height="5" fill="#f9f7ff"/></g>
