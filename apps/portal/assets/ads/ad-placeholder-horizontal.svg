<svg xmlns="http://www.w3.org/2000/svg" width="728" height="90" viewBox="0 0 728 90" role="img" aria-label="Place your ad here. Contact KingDankKush.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0e1a"/>
      <stop offset="0.5" stop-color="#10182e"/>
      <stop offset="1" stop-color="#0a0e1a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#19f7ff"/>
      <stop offset="1" stop-color="#9aa7c7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="0" y="0" width="728" height="90" rx="10" fill="url(#bg)"/>
  <rect x="2" y="2" width="724" height="86" rx="9" fill="none" stroke="url(#accent)" stroke-width="2" stroke-dasharray="10 7" opacity="0.85"/>
  <!-- Litecoin-style silver coin mark -->
  <g transform="translate(56 45)">
    <circle r="26" fill="#0d1426" stroke="#9aa7c7" stroke-width="2"/>
    <circle r="26" fill="none" stroke="#19f7ff" stroke-width="1" opacity="0.5"/>
    <text x="0" y="9" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-style="italic" font-weight="700" fill="url(#accent)" filter="url(#glow)">&#321;</text>
  </g>
  <text x="110" y="40" font-family="'Trebuchet MS', Verdana, sans-serif" font-size="26" font-weight="800" letter-spacing="1" fill="#f4f7ff" filter="url(#glow)">PLACE YOUR AD HERE</text>
  <text x="111" y="66" font-family="'Trebuchet MS', Verdana, sans-serif" font-size="14" font-weight="600" letter-spacing="0.5" fill="#19f7ff">Reach the Lester&#39;s Arcade community &#183; Contact <tspan font-weight="800" fill="#ffd24a">KingDankKush</tspan></text>
  <text x="700" y="52" text-anchor="end" font-family="'Trebuchet MS', Verdana, sans-serif" font-size="11" font-weight="700" letter-spacing="2" fill="#9aa7c7">AD&#183;SPACE</text>
</svg>
