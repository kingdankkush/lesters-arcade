<svg xmlns="http://www.w3.org/2000/svg" width="300" height="600" viewBox="0 0 300 600" role="img" aria-label="Place your ad here. Contact KingDankKush.">
  <defs>
    <linearGradient id="bgv" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0e1a"/>
      <stop offset="0.5" stop-color="#11182e"/>
      <stop offset="1" stop-color="#0a0e1a"/>
    </linearGradient>
    <linearGradient id="accentv" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#19f7ff"/>
      <stop offset="1" stop-color="#9aa7c7"/>
    </linearGradient>
    <filter id="glowv" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="0" y="0" width="300" height="600" rx="12" fill="url(#bgv)"/>
  <rect x="3" y="3" width="294" height="594" rx="10" fill="none" stroke="url(#accentv)" stroke-width="2" stroke-dasharray="11 8" opacity="0.85"/>
  <!-- Litecoin-style silver coin mark -->
  <g transform="translate(150 150)">
    <circle r="54" fill="#0d1426" stroke="#9aa7c7" stroke-width="3"/>
    <circle r="54" fill="none" stroke="#19f7ff" stroke-width="1.5" opacity="0.5"/>
    <text x="0" y="20" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="62" font-style="italic" font-weight="700" fill="url(#accentv)" filter="url(#glowv)">&#321;</text>
  </g>
  <text x="150" y="270" text-anchor="middle" font-family="'Trebuchet MS', Verdana, sans-serif" font-size="30" font-weight="800" letter-spacing="1" fill="#f4f7ff" filter="url(#glowv)">PLACE YOUR</text>
  <text x="150" y="306" text-anchor="middle" font-family="'Trebuchet MS', Verdana, sans-serif" font-size="30" font-weight="800" letter-spacing="1" fill="#f4f7ff" filter="url(#glowv)">AD HERE</text>
  <line x1="60" y1="340" x2="240" y2="340" stroke="#19f7ff" stroke-width="1.5" opacity="0.5"/>
  <text x="150" y="380" text-anchor="middle" font-family="'Trebuchet MS', Verdana, sans-serif" font-size="15" font-weight="600" fill="#c9d4ee">Reach the Lester&#39;s Arcade</text>
  <text x="150" y="402" text-anchor="middle" font-family="'Trebuchet MS', Verdana, sans-serif" font-size="15" font-weight="600" fill="#c9d4ee">ecosystem community</text>
  <text x="150" y="470" text-anchor="middle" font-family="'Trebuchet MS', Verdana, sans-serif" font-size="14" font-weight="700" letter-spacing="1" fill="#19f7ff">CONTACT</text>
  <text x="150" y="500" text-anchor="middle" font-family="'Trebuchet MS', Verdana, sans-serif" font-size="24" font-weight="800" letter-spacing="0.5" fill="#ffd24a" filter="url(#glowv)">KingDankKush</text>
  <text x="150" y="566" text-anchor="middle" font-family="'Trebuchet MS', Verdana, sans-serif" font-size="11" font-weight="700" letter-spacing="3" fill="#9aa7c7">PARTNER AD&#183;SPACE</text>
</svg>
