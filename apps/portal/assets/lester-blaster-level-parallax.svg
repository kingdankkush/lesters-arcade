<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc">
  <title id="title">Hard Money Heroes parallax level plan</title>
  <desc id="desc">The Slums, The Tower, and The Getaway with multi-layer parallax, vertical platforms, mini-boss locks, and high-speed finale pacing.</desc>
  <rect width="1000" height="360" fill="#060817"/>
  <g font-family="monospace" fill="#f9f7ff"><text x="24" y="30">LEVEL 1: THE SLUMS</text><text x="364" y="30">LEVEL 2: THE TOWER</text><text x="704" y="30">LEVEL 3: THE GETAWAY</text></g>
  <g shape-rendering="crispEdges">
    <g transform="translate(20 52)"><rect width="300" height="250" fill="#091831"/><rect y="190" width="300" height="60" fill="#101827"/><g fill="#19f7ff" opacity=".42"><rect x="20" y="48" width="72" height="16"/><rect x="132" y="80" width="58" height="14"/><rect x="212" y="44" width="62" height="18"/></g><g fill="#ff7b2f"><rect x="40" y="156" width="72" height="24"/><rect x="116" y="130" width="54" height="18"/><rect x="205" y="150" width="72" height="24"/></g><rect x="225" y="112" width="64" height="78" fill="#ff476f"/><text x="168" y="224" font-family="monospace" font-size="13" fill="#ffe84d">MINI-BOSS LOCK</text></g>
    <g transform="translate(360 52)"><rect width="300" height="250" fill="#081226"/><rect y="190" width="300" height="60" fill="#1a2440"/><g fill="#45ff8a" opacity=".42"><rect x="12" y="58" width="280" height="8"/><rect x="30" y="108" width="250" height="7"/><rect x="0" y="140" width="300" height="10"/></g><g fill="#19f7ff"><rect x="26" y="150" width="60" height="18"/><rect x="110" y="118" width="60" height="18"/><rect x="196" y="86" width="66" height="18"/></g><rect x="210" y="124" width="58" height="66" fill="#ff7b2f"/><text x="72" y="224" font-family="monospace" font-size="13" fill="#ffe84d">MORE VERTICALITY</text></g>
    <g transform="translate(700 52)"><rect width="300" height="250" fill="#1a0626"/><rect y="190" width="300" height="60" fill="#101827"/><g fill="#b86cff" opacity=".48"><rect x="20" y="42" width="70" height="18"/><rect x="124" y="68" width="70" height="18"/><rect x="210" y="40" width="70" height="18"/></g><g fill="#ffe84d"><rect x="22" y="160" width="62" height="18"/><rect x="112" y="126" width="58" height="18"/><rect x="200" y="94" width="62" height="18"/></g><rect x="225" y="72" width="70" height="118" fill="#ff236d"/><text x="92" y="224" font-family="monospace" font-size="13" fill="#45ff8a">INFINITE ESCALATION</text></g>
  </g>
</svg>
