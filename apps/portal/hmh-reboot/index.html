<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07121f" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23071522'/%3E%3Cpath d='M16 38h18l-6 12 20-24H30l6-12z' fill='%238ff3ff'/%3E%3C/svg%3E" />
    <title>Hard Money Heroes Reboot Runtime</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main id="hmhRebootShell" class="hmh-reboot-shell">
      <div id="hmhRebootStage" class="hmh-reboot-stage" role="img" aria-label="Hard Money Heroes top-down reboot renderer"></div>
      <aside class="hmh-reboot-status-card" aria-live="polite">
        <span class="hmh-reboot-kicker">HMH // TOP-DOWN 2.5D REBOOT</span>
        <strong id="hmhRebootStatus">Starting PixiJS renderer…</strong>
        <span id="hmhRebootSession">Standalone shell</span>
        <output id="hmhRebootDashStatus" class="hmh-reboot-dash-status" role="status" aria-live="polite" aria-atomic="true" data-ready="true">Dash ready</output>
      </aside>
      <output id="hmhRebootCombatStatus" class="hmh-sr-only" role="status" aria-live="polite" aria-atomic="true">Combat ready</output>
    </main>
    <script type="module" src="../dist/hmh-reboot/game.js"></script>
  </body>
</html>
