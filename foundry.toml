[profile.default]
src = "contracts/src"
test = "contracts/test"
out = "contracts/out"
libs = ["node_modules"]
remappings = ["@openzeppelin/=node_modules/@openzeppelin/"]
solc = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
ffi = false
gas_reports = ["*"]
fs_permissions = [{ access = "read", path = "./contracts" }]

[fuzz]
runs = 10000
max_test_rejects = 65536

[invariant]
runs = 256
depth = 64
fail_on_revert = false
