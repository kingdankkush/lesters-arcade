[profile.default]
src = "contracts/src"
test = "contracts/test"
out = "contracts/out"
libs = ["node_modules"]
solc_version = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
ffi = false
fs_permissions = [{ access = "read", path = "./contracts" }]

[fuzz]
runs = 10000

[invariant]
runs = 256
depth = 64
fail_on_revert = false
